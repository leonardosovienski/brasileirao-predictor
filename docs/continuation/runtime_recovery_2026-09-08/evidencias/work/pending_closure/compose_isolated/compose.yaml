name: brasileirao-pending-20260908-0418
services:
  redis:
    image: redis:8.2.1-alpine3.22
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  init-data:
    build:
      context: C:/Users/Superleo13/Documents/Codex/2026-09-07/leia-e-execute-c-users-superleo13/work/integration-repo
      dockerfile: Dockerfile.cli
    entrypoint:
    - python
    - -m
    - brasileirao_scripts.init_compose_data
    user: 0:0
    environment:
      REDIS_URL: redis://redis:6379/0
      SPORTS_DB_PATH: /app/data/sports.db
      MARKET_DB_PATH: /app/data/market.db
      VORP_ARTIFACT_PATH: /app/config/vorp.json
      TITULARIDADE_PATH: /app/config/titularidade.json
      RUNTIME_DIR: /app/runtime
      KERNEL_VORP_THETA: '0.0'
      KERNEL_MAX_GOALS: '12'
      BRASILEIRAO_CONFIG_PATH: /app/config.yaml
    volumes:
    - type: volume
      source: app-data
      target: /app/data
      read_only: false
    - type: bind
      source: C:/Users/Superleo13/Documents/Codex/2026-09-07/leia-e-execute-c-users-superleo13/work/pending_closure/compose_isolated/fixtures/config.yaml
      target: /app/config.yaml
      read_only: true
    restart: 'no'
  kernel:
    build:
      context: C:/Users/Superleo13/Documents/Codex/2026-09-07/leia-e-execute-c-users-superleo13/work/integration-repo
      dockerfile: Dockerfile.kernel
    environment:
      REDIS_URL: redis://redis:6379/0
      SPORTS_DB_PATH: /app/data/sports.db
      MARKET_DB_PATH: /app/data/market.db
      VORP_ARTIFACT_PATH: /app/config/vorp.json
      TITULARIDADE_PATH: /app/config/titularidade.json
      RUNTIME_DIR: /app/runtime
      KERNEL_VORP_THETA: '0.0'
      KERNEL_MAX_GOALS: '12'
      BRASILEIRAO_CONFIG_PATH: /app/config.yaml
    volumes:
    - type: volume
      source: app-data
      target: /app/data
      read_only: true
    - type: bind
      source: C:/Users/Superleo13/Documents/Codex/2026-09-07/leia-e-execute-c-users-superleo13/work/pending_closure/compose_isolated/fixtures/config.yaml
      target: /app/config.yaml
      read_only: true
    read_only: true
    tmpfs:
    - /tmp
    depends_on:
      redis:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - brasileirao-kernel
      - --healthcheck
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: C:/Users/Superleo13/Documents/Codex/2026-09-07/leia-e-execute-c-users-superleo13/work/integration-repo
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      SPORTS_DB_PATH: /app/data/sports.db
      MARKET_DB_PATH: /app/data/market.db
      VORP_ARTIFACT_PATH: /app/config/vorp.json
      TITULARIDADE_PATH: /app/config/titularidade.json
      RUNTIME_DIR: /app/runtime
      KERNEL_VORP_THETA: '0.0'
      KERNEL_MAX_GOALS: '12'
      BRASILEIRAO_CONFIG_PATH: /app/config.yaml
      LINEUP_Exchange__WebSocketUrl: ws://127.0.0.1:9
      LINEUP_Exchange__ApiKey: ''
    volumes:
    - type: volume
      source: app-data
      target: /app/data
      read_only: true
    - type: bind
      source: C:/Users/Superleo13/Documents/Codex/2026-09-07/leia-e-execute-c-users-superleo13/work/pending_closure/compose_isolated/fixtures/config.yaml
      target: /app/config.yaml
      read_only: true
    - type: bind
      source: C:/Users/Superleo13/Documents/Codex/2026-09-07/leia-e-execute-c-users-superleo13/work/pending_closure/compose_isolated/fixtures
      target: /app/config
      read_only: true
    read_only: true
    tmpfs:
    - /tmp
    depends_on:
      redis:
        condition: service_healthy
      kernel:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - dotnet
      - LineupWorker.dll
      - --healthcheck
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  redis-data: null
  app-data: null
networks:
  default:
    internal: true
