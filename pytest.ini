[pytest]
# testpaths trava a descoberta em tests/ — sem isso o pytest rodado da pasta pai
# escaneia a máquina inteira (foi o loop infinito da Batalha 3 do post-mortem).
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v -m "not integration"
markers =
    integration: requires the CI Redis service and runs in its dedicated job step
