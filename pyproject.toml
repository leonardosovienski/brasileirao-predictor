[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "brasileirao-predictor"
version = "0.1.0"
description = "Scientific and operational prediction services for Brasileirão Série A"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "predictor-core>=3.0,<4",
  "predictor-ops>=4.0,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "PyYAML>=6.0,<7",
  "truststore>=0.10,<1",
  "requests>=2.32,<3",
  "jsonschema>=4.25,<5",
]

[project.optional-dependencies]
providers = ["beautifulsoup4>=4.13,<5", "lxml>=5.3,<7", "html5lib>=1.1,<2", "curl-cffi>=0.13,<1"]
kernel = ["redis[hiredis]>=6.2,<9", "numba>=0.61,<1"]
dev = ["build>=1.3,<2", "coverage[toml]>=7.10,<8", "pre-commit>=4.3,<5", "pyright>=1.1.400,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[project.scripts]
brasileirao-predict = "brasileirao_predictor.predict:main"
brasileirao-kernel = "brasileirao_predictor.kernel_daemon:main"
brasileirao-shadow = "brasileirao_scripts.sombra_diaria:main"

[project.entry-points."predictor.plugins"]
brasileirao = "brasileirao_predictor.ecosystem_plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["brasileirao_predictor", "brasileirao_scripts"]

[tool.uv.sources]
predictor-core = { url = "https://github.com/leonardosovienski/core-predictor/releases/download/v3.1.0/predictor_core-3.1.0-py3-none-any.whl" }
predictor-ops = { url = "https://github.com/leonardosovienski/predictor-ops/releases/download/v4.1.0/predictor_ops-4.1.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
include = ["brasileirao_predictor"]
exclude = ["brasileirao_predictor/research"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["brasileirao_predictor", "brasileirao_scripts"]
branch = true
