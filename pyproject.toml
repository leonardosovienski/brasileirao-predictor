[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "brasileirao-predictor"
version = "0.1.0"
description = "Scientific and operational prediction services for Brasileirão Série A"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "predictor-core>=2.3,<3",
  "predictor-ops>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scipy>=1.15,<2",
  "PyYAML>=6.0,<7",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
providers = ["beautifulsoup4>=4.13,<5", "lxml>=5.3,<7", "html5lib>=1.1,<2", "curl-cffi>=0.13,<1"]
kernel = ["redis[hiredis]>=6.2,<7", "numba>=0.61,<1"]
dev = ["build>=1.3,<2", "coverage[toml]>=7.10,<8", "pre-commit>=4.3,<5", "pyright>=1.1.400,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[project.scripts]
brasileirao-predict = "src.predict:main"
brasileirao-kernel = "src.kernel_daemon:main"
brasileirao-shadow = "scripts.sombra_diaria:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.uv.sources]
predictor-core = { url = "https://github.com/leonardosovienski/core-predictor/releases/download/v2.3.0/predictor_core-2.3.0-py3-none-any.whl" }
predictor-ops = { url = "https://github.com/leonardosovienski/predictor-ops/releases/download/v3.1.0/predictor_ops-3.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]
exclude = ["src/research"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src", "scripts"]
branch = true
