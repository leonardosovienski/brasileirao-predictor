# Identidade do domínio (PASSO 1.3): consumida por display/simulator no lugar
# das constantes "World Cup 2026" herdadas do wc-predictor-v2.
league: "Brasileirão Série A 2026"
# Nome de torneio gravado em matches.tournament pelo espelho sofascore→matches
# (scripts/sync_matches_from_sofascore.py). Também é a chave de k_factor.
tournament_name: "Brasileirão Série A"

# HERANÇA DO WC: o CSV martj42 é SÓ de seleções — não existe equivalente para
# clubes. No Brasileirão a tabela `matches` é alimentada pelo espelho do
# Sofascore (scripts/sync_matches_from_sofascore.py); NÃO rode `python -m
# src.ingest` neste domínio (repovoaria a base com seleções).
source:
  url: null
  local_fallback: null

database: data/matches.db

elo:
  initial_rating: 1500
  home_advantage: 100
  # corte duro: só partidas dos últimos N anos entram no cálculo. Nada antes.
  window_years: 6
  # meia-vida da "memória" em anos: resultado dessa idade pesa 50%.
  form_half_life_years: 4.0
  k_factors:
    # liga nacional de clubes: importância regular — mesmo peso do default.
    "Brasileirão Série A": 30
    default: 30
    "Friendly": 20

model:
  # calibra o Poisson só na forma recente (2024-2025 cabem inteiras na janela)
  calibration_window_years: 4
  max_goals: 12

# Ensemble baseline × atk/def-xG (src/xg_model.py).
#
# DESLIGADO em 2026-08-22 pela trial h12-ensemble-xg-ligado-vs-desligado
# (COMPROVADA, scripts/research_xg_ensemble.py). Teste pareado jogo a jogo em
# 2021-2024, n=1318, motor `serving`, uma variável só:
#   RPS        com ensemble 0.217749 → sem 0.213339, ganho +0.004410,
#              IC95 [+0.001436, +0.007741]
#   Brier 1X2  ganho +0.021648, IC95 [+0.008562, +0.036863]
#   Brier OU25 ganho +0.030696, IC95 [+0.019290, +0.043565]
#   log-loss   ganho +0.027244, IC95 [+0.010618, +0.046425]
# Os quatro IC inteiramente acima de zero: o ensemble piorava TODAS as
# métricas, não trocava umas pelas outras. xg_fit_failures=0 no braço ligado,
# então o contraste medido é o real, não uma versão degradada.
#
# POR QUE ELE ESTAVA LIGADO, E POR QUE ISSO NÃO VALIA: a justificativa
# anterior era um walk-forward em "2025+2026" (dBrier 1X2 -0.0073, IC95
# [-0.0122, -0.0019], docs/SIMULACAO_2025_2026.md), com a flag ligada em
# 2026-07-17 sob o pré-registro da H5 (h5-ensemble-xg-sombra-2026). Mas 2025 é
# HOLDOUT SELADO (Regra 7) e 2026 é exploratório (Regra 1) — nenhum dos dois
# valida arquitetura. Medido no período legítimo de desenvolvimento
# (2021-2024), o efeito se INVERTE. O pré-registro da H5 foi cumprido; o que
# faltou foi a origem dos dados.
#
# A H3 segue baseline puro por construção (sombra.py chama model.predict_match
# direto, imune a esta flag).
# Hiperparâmetros CONGELADOS pela validação 2024-H2 — não recalibrar avulso.
ensemble_xg:
  enabled: false
  blend_weight: 0.5        # peso do baseline na mistura das grades
  w_xg: 0.85               # peso do xG no alvo misto da etapa 1
  half_life_years: 0.75    # meia-vida do decaimento temporal
  ridge_reg: 1.0           # L2 sobre as forças atk/def

# Braço de pesquisa TRACK A02; não é consumido pelo serving de produção.
dynamic_strength:
  alpha_short: 0.3
  alpha_long: 0.05
  ridge_reg: 1.0
  eps: 0.1

backtest:
  # janela de edge apostável: estanca o sangramento das duas extremidades.
  # < min_edge = ruído engolido pelo vig; > max_edge = informação ausente no
  # modelo (lesão, time misto). O sweet spot validado na Copa fica no meio.
  min_edge: 0.02
  max_edge: 0.15
  over_under_line: 2.5   # linha principal de gols auditada além do 1X2
  # bootstrap de significância (python -m src.bootstrap) — IC 95% da média
  bootstrap_iterations: 1000
  bootstrap_seed: 13
  # walk-forward (scripts/eval_walkforward_brasileirao.py): tamanho do bloco
  # de teste em RODADAS da Série A (38 = 1 temporada; 19 = 1 turno)
  walk_forward_window_rounds: 19

player_stats:
  cache_dir: data/fbref_cache
  rate_limit_seconds: 4
  competitions: []   # FBref bloqueado (403) desde a Copa — fora do pipeline

odds_shop:
  # sport key da The Odds API (catálogo /v4/sports). Confirmar na primeira
  # coleta com chave real: GET /v4/sports?apiKey=...
  sport: soccer_brazil_campeonato

sofascore:
  cache_dir: data/sofascore_cache
  rate_limit_seconds: 1.5
  # ut_id 325 = Brasileirão Série A (season 20/21 na lista = temporada COVID,
  # assinatura da liga). season_ids descobertos via
  # `python -m src.ingest_sofascore --seasons 325` em 2026-07-10 (2024-2026)
  # e 2026-08-19 (2021-2023, pro burn-in/treino pedido pelo Roadmap Técnico
  # Consolidado v1.0-final §3 — 2021-2023 treino, 2025 holdout selado).
  competitions:
    - name: Brasileirão Série A 2021
      season: "2021"
      ut_id: 325
      season_id: 36166
    - name: Brasileirão Série A 2022
      season: "2022"
      ut_id: 325
      season_id: 40557
    - name: Brasileirão Série A 2023
      season: "2023"
      ut_id: 325
      season_id: 48982
    - name: Brasileirão Série A 2024
      season: "2024"
      ut_id: 325
      season_id: 58766
    - name: Brasileirão Série A 2025
      season: "2025"
      ut_id: 325
      season_id: 72034
    - name: Brasileirão Série A 2026
      season: "2026"
      ut_id: 325
      season_id: 87678
      upcoming: true
