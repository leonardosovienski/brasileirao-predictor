name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint & Test (.NET + Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Projeto Atual)
        uses: actions/checkout@v4

      - name: Clonar Tools Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/tools-predictor
          path: tools

      - name: Clonar Core Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/core-predictor
          path: core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LineupWorker (.NET)
        run: dotnet build dotnet/LineupWorker || true

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements-kernel.txt ]; then pip install -r requirements-kernel.txt; fi

      - name: Simular Workspace Local (sys.path)
        run: |
          if [ -f pyproject.toml ]; then
            PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('name', ''))")
            if [ -n "$PACKAGE_NAME" ]; then
              ln -sfn $(pwd) ../$PACKAGE_NAME
            fi
          fi

      - name: Executar Testes
        run: |
          PYTHONPATH=.:vendor:core:tools python -m pytest -v \
            --ignore=tests/test_weekly_download.py
