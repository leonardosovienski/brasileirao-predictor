# Aposentado por D-13 (integração V1 extinta, qualificação pré-treinamento, HYG-015).
# Só roda por workflow_dispatch; fora do escopo de HOSTED_CI. Preservado como
# referência para os testes da integração (Etapa B).
name: Cain report exporter
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/test_export_cain_status.py
      - run: python -m py_compile tools/export_cain_status.py
  documentary-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the pinned consumer and its vendored contracts in an isolated environment
        run: |
          git clone --no-checkout https://github.com/leonardosovienski/cain.git "$RUNNER_TEMP/cain-source"
          git -C "$RUNNER_TEMP/cain-source" checkout --detach 5ba4177a11b9312900e5035517aa5ef25d509859
          python -m venv "$RUNNER_TEMP/cain-env"
          "$RUNNER_TEMP/cain-env/bin/python" -m pip install --find-links "$RUNNER_TEMP/cain-source/vendor" "$RUNNER_TEMP/cain-source[dev]"
      - name: Verify real documentary input through isolated CAIN CLI API and Historian
        run: |
          case_output="$(dirname "$GITHUB_WORKSPACE")/brasileirao-cain-case"
          echo "CAIN_CASE_OUTPUT=$case_output" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/cain-env/bin/python" tools/integration_validation/run.py "$GITHUB_WORKSPACE" "$case_output"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brasileirao-cain-documentary-integration
          path: ${{ env.CAIN_CASE_OUTPUT }}
